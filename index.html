<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIYALAIR LOGISTICS | POST GENERATOR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav id="control-panel">
        <div class="tabs" id="slide-tabs">
            </div>
        <div class="actions">
            <button type="button" id="download-active" class="action-btn download">DOWNLOAD SLIDE</button>
        </div>
    </nav>

    <div id="render-container">
        <!-- [CRITICAL ENHANCEMENT]: Embedded dynamic background tracking data attribute sync -->
        <div id="post-canvas" class="instagram-portrait" data-bg-tracker="1">
            
            <main class="content-body">
                <header>
                    <h1 id="slide-heading">INITIALIZING...</h1>
                    <div class="header-divider"></div>
                </header>
                
                <section id="slide-content">
                </section>

                <div id="slide-tags" class="tag-container"></div>

                <footer class="canvas-footer" style="display: none !important;">
                    <p>NEWS. INSIGHT. IMPACT.</p>
                    <div class="footer-accent"></div>
                </footer>
            </main>

        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- [CRITICAL ENHANCEMENT]: Robust cache-busting loader that synchronously injects dynamic trackers and assets -->
    <script>
      (function() {
        const cacheBuster = new Date().getTime();
        
        // 1. Fetch and apply bg_tracker.txt dynamically to the render canvas element data state
        fetch(`bg_tracker.txt?v=${cacheBuster}`)
          .then(res => res.text())
          .then(text => {
              const bgVal = text.trim();
              if (bgVal && !isNaN(bgVal)) {
                  const canvasEl = document.getElementById('post-canvas');
                  if (canvasEl) {
                      canvasEl.setAttribute('data-bg-tracker', bgVal);
                      // Apply dynamic inline styling fallback mapping or trigger state attribute refresh
                      canvasEl.style.setProperty('--bg-index', bgVal);
                  }
              }
          })
          .catch(err => console.warn("Background tracker fetch skipped:", err));

        // 2. Load template.js with strict synchronization
        const script = document.createElement('script');
        script.src = `template.js?v=${cacheBuster}`;
        script.async = false; 
        document.body.appendChild(script);
      })();
    </script>

    <script src="engine.js"></script>
</body>
</html>
