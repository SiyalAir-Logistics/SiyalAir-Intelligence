<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIYALAIR LOGISTICS | POST GENERATOR</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <nav id="control-panel">
        <div class="tabs" id="slide-tabs">
            </div>
        <div class="actions">
            <button type="button" id="download-active" class="action-btn download">DOWNLOAD SLIDE</button>
        </div>
    </nav>

    <div id="render-container">
        <div id="post-canvas" class="instagram-portrait">
            
            <main class="content-body">
                <header>
                    <h1 id="slide-heading">INITIALIZING...</h1>
                    <div class="header-divider"></div>
                </header>
                
                <section id="slide-content">
                </section>

                <div id="slide-tags" class="tag-container"></div>

                <footer class="canvas-footer" style="display: none !important;">
                    <p>NEWS. INSIGHT. IMPACT.</p>
                    <div class="footer-accent"></div>
                </footer>
            </main>

        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <script>
      (function() {
        const cacheBuster = new Date().getTime();
        
        // Try local script first, fallback or dual check root level template.js if running nested
        const script = document.createElement('script');
        script.src = `template.js?v=${cacheBuster}`;
        script.async = false;
        
        script.onerror = () => {
          const rootScript = document.createElement('script');
          rootScript.src = `../template.js?v=${cacheBuster}`;
          rootScript.async = false;
          document.body.appendChild(rootScript);
        };

        document.body.appendChild(script);
      })();
    </script>

    <script src="engine.js"></script>
    
    <!-- ============================================================================== -->
    <!-- DYNAMIC ASSET TRACKER INTEGRATION MODULE (BACKGROUND & FOLLOW-UP SYNC)        -->
    <!-- ============================================================================== -->
    <script>
      (async function() {
        try {
          const timestamp = Date.now();
          
          // Fetch dynamic background index from server tracker (Checking root directory first, then local fallback)
          let bgIndex = "1";
          try {
            const rootBgRes = await fetch(`../bg_tracker.txt?v=${timestamp}`);
            if (rootBgRes.ok) {
              bgIndex = (await rootBgRes.text()).trim() || "1";
            } else {
              throw new Error('Root tracker not found');
            }
          } catch (rootErr) {
            const bgRes = await fetch(`bg_tracker.txt?v=${timestamp}`);
            if (bgRes.ok) {
              bgIndex = (await bgRes.text()).trim() || "1";
            }
          }

          const canvasEl = document.getElementById('post-canvas');
          if (canvasEl) {
            // Attempt asset path resolution across root vs local folders
            const bgPaths = [
              `../assets/background${bgIndex}.png`,
              `assets/background${bgIndex}.png`,
              `../yt_backgrounds/backgroundyt${bgIndex}.png`,
              `yt_backgrounds/backgroundyt${bgIndex}.png`
            ];

            let bgLoaded = false;
            for (const path of bgPaths) {
              try {
                const testRes = await fetch(path + '?v=' + timestamp);
                if (testRes.ok) {
                  canvasEl.style.backgroundImage = `url('${path}')`;
                  bgLoaded = true;
                  console.log(`[SUCCESS] Dynamic Background Loaded: ${path}`);
                  break;
                }
              } catch (e) {}
            }

            if (!bgLoaded) {
              canvasEl.style.backgroundImage = `url('assets/background${bgIndex}.png')`;
            }

            canvasEl.style.backgroundSize = 'cover';
            canvasEl.style.backgroundPosition = 'center';
          }

          // Fetch dynamic follow-up slide index from server tracker (Root first, then local)
          let followIndex = "1";
          try {
            const rootFollowRes = await fetch(`../follow_tracker.txt?v=${timestamp}`);
            if (rootFollowRes.ok) {
              followIndex = (await rootFollowRes.text()).trim() || "1";
            } else {
              throw new Error('Root follow tracker not found');
            }
          } catch (rootErr) {
            const followRes = await fetch(`follow_tracker.txt?v=${timestamp}`);
            if (followRes.ok) {
              followIndex = (await followRes.text()).trim() || "1";
            }
          }

          window.DYNAMIC_FOLLOW_INDEX = followIndex;
          console.log(`[SUCCESS] Dynamic Follow-up State Registered: slide9-${followIndex}.png`);

        } catch (err) {
          console.warn("[WARNING] Dynamic asset tracker fetch deferred, falling back to default states:", err);
        }
      })();
    </script>
</body>
</html>
