<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIYALAIR LOGISTICS | POST GENERATOR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav id="control-panel">
        <div class="tabs" id="slide-tabs">
            </div>
        <div class="actions">
            <button type="button" id="download-active" class="action-btn download">DOWNLOAD SLIDE</button>
        </div>
    </nav>

    <div id="render-container">
        <div id="post-canvas" class="instagram-portrait">
            
            <main class="content-body">
                <header>
                    <h1 id="slide-heading">INITIALIZING...</h1>
                    <div class="header-divider"></div>
                </header>
                
                <section id="slide-content">
                </section>

                <div id="slide-tags" class="tag-container"></div>

                <footer class="canvas-footer" style="display: none !important;">
                    <p>NEWS. INSIGHT. IMPACT.</p>
                    <div class="footer-accent"></div>
                </footer>
            </main>

        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <script>
      (function() {
        const cacheBuster = new Date().getTime();
        const script = document.createElement('script');
        script.src = `template.js?v=${cacheBuster}`;
        script.async = false; // Guarantees execution completes sequentially before engine.js processes it
        document.body.appendChild(script);
      })();
    </script>

    <script src="engine.js"></script>

    <!-- ULTIMATE PERSISTENT ENGINE-AWARE BADGE INJECTOR -->
    <script>
      (function() {
        const forceInject = () => {
          const heading = document.getElementById('slide-heading');
          if (heading) {
            const header = heading.closest('header') || heading.parentElement;
            if (header && !header.querySelector('.top-story-container')) {
              const container = document.createElement('div');
              container.className = 'top-story-container';
              container.setAttribute('style', 'display: block !important; visibility: visible !important; opacity: 1 !important; position: relative !important; z-index: 9999 !important; margin: 0 0 16px 0 !important; width: 100% !important; text-align: left !important;');
              container.innerHTML = '<img src="assets/TOP_STORY.png" alt="TOP STORY" class="top-story-badge-img" crossorigin="anonymous" style="display: inline-block !important; visibility: visible !important; opacity: 1 !important; height: 36px !important; width: auto !important; object-fit: contain !important; filter: drop-shadow(0 0 12px rgba(0,0,0,0.5)) !important;">';
              header.insertBefore(container, heading);
            }
          }
        };

        // Watch for engine.js DOM rebuilds and mutations instantly
        const observer = new MutationObserver(() => {
          forceInject();
        });
        
        const targetContainer = document.getElementById('render-container') || document.body;
        observer.observe(targetContainer, { 
          childList: true, 
          subtree: true 
        });

        // Continuous execution loop to bulletproof against engine refresh cycles
        setInterval(forceInject, 50);
        window.addEventListener('load', forceInject);
      })();
    </script>
</body>
</html>
