<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIYALAIR LOGISTICS | POST GENERATOR</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Embedded styling for language selector dropdown to match top bar UI */
        .language-selector {
            background: #0d1117 !important;
            color: #00d2ff !important;
            border: 1px solid rgba(0, 210, 255, 0.4) !important;
            padding: 8px 14px !important;
            border-radius: 4px !important;
            font-size: 14px !important;
            font-weight: 700 !important;
            cursor: pointer !important;
            margin-right: 12px !important;
            outline: none !important;
            transition: all 0.2s ease !important;
            font-family: inherit !important;
        }
        .language-selector:hover {
            border-color: #00d2ff !important;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.3) !important;
        }
        .language-selector option {
            background: #0d1117 !important;
            color: #ffffff !important;
        }
    </style>
</head>
<body>

    <nav id="control-panel">
        <div class="tabs" id="slide-tabs">
            </div>
        <div class="actions">
            <select id="language-select" class="action-btn language-selector" onchange="if(typeof window.switchLanguage === 'function') { window.switchLanguage(this.value); }">
                <option value="en" selected>🌐 EN (English)</option>
                <option value="de">🌐 DE (Deutsch)</option>
                <option value="fr">🌐 FR (Français)</option>
                <option value="es">🌐 ES (Español)</option>
            </select>
            <button type="button" id="download-active" class="action-btn download">DOWNLOAD SLIDE</button>
        </div>
    </nav>

    <div id="render-container">
        <div id="post-canvas" class="instagram-portrait">
            
            <main class="content-body">
                <header>
                    <h1 id="slide-heading">INITIALIZING...</h1>
                    <div class="header-divider"></div>
                </header>
                
                <section id="slide-content">
                </section>

                <div id="slide-tags" class="tag-container"></div>

                <footer class="canvas-footer" style="display: none !important;">
                    <p>NEWS. INSIGHT. IMPACT.</p>
                    <div class="footer-accent"></div>
                </footer>
            </main>

        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <script>
      (function() {
        const cacheBuster = new Date().getTime();
        const script = document.createElement('script');
        script.src = `template.js?v=${cacheBuster}`;
        script.async = false; // Guarantees execution completes sequentially before engine.js processes it
        document.body.appendChild(script);
      })();
    </script>

    <script src="engine.js"></script>
</body>
</html>
