# ==============================================================================
# SIYALAIR-INTEL-STUDIO ORCHESTRATION PIPELINE (PROD_v2.0_2026)
# DIRECTORY:    .github/workflows/
# MODULE:       main.yml
# PURPOSE:      Orchestrates end-to-end automated news generation, asset dynamic rotation,
#               canvas slide screenshot capturing, repository synchronization, and 
#               SMTP dispatch notifications on an hourly cron schedule.
# ==============================================================================

name: Hourly Intel Automation

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'template.js'            # Prevent re-entrant triggers from template data updates
      - 'post.txt'               # Prevent re-entrant triggers from text payload updates
      - 'download/**'            # Prevent re-entrant triggers from screenshot asset commits
      - 'bg_tracker.txt'         # Prevent re-entrant triggers from background state updates
      - 'follow_tracker.txt'     # Prevent re-entrant triggers from follow-up slide state updates
      - 'Social_Media/**'        # Prevent re-entrant triggers from template code updates
  workflow_dispatch:
  schedule:
    - cron: '16 * * * *'        # Primary precise hourly trigger (runs at :16 past every hour each hour)

jobs:
  run-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ==============================================================================
      # [ STEP 1: WORKSPACE CHECKOUT & SYSTEM SETUP ]
      # ==============================================================================
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0             # Preserved from backup: Full history depth for exact tree tracking
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Python Runtime Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-genai

      # ==============================================================================
      # [ STEP 2: INTEL ENGINE GENERATION ]
      # ==============================================================================
      - name: Run Intelligence Generation Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_intel.py

      # ==============================================================================
      # [ STEP 3: ASSET TRACKER ROTATION & CORE DATA COMMIT ]
      # ==============================================================================
      - name: Process Dynamic Tracker Rotation and Commit Data
        run: |
          git config --global user.name "SiyalAir-Bot"
          git config --global user.email "bot@siyalair.com"
          
          # Fetch remote tracking branch and reset working tree state
          git fetch origin main
          git reset --mixed origin/main
          
          # Dynamically rotate background tracker index
          python - << 'EOF'
          import os
          import glob

          tracker_file = "bg_tracker.txt"
          bg_files = glob.glob("assets/background*.png")
          valid_indices = []

          for f in bg_files:
              filename = os.path.basename(f)
              num_part = filename.replace("background", "").replace(".png", "")
              if num_part.isdigit():
                  valid_indices.append(int(num_part))

          max_backgrounds = max(valid_indices) if valid_indices else 1

          try:
              if os.path.exists(tracker_file):
                  with open(tracker_file, "r", encoding="utf-8") as f:
                      current_val = int(f.read().strip())
              else:
                  current_val = 1
          except Exception:
              current_val = 1

          if current_val >= max_backgrounds:
              next_val = 1
          else:
              next_val = current_val + 1

          with open(tracker_file, "w", encoding="utf-8") as f:
              f.write(str(next_val))

          print(f"Dynamic Background Rotation: Found {max_backgrounds} total backgrounds. Rotated tracker: {current_val} -> {next_val}")
          EOF

          # Dynamically rotate follow-up CTA slide tracker index
          python - << 'EOF'
          import os
          import glob

          follow_tracker_file = "follow_tracker.txt"
          follow_files = glob.glob("followup/slide9-*.png")
          valid_follow_indices = []

          for f in follow_files:
              filename = os.path.basename(f)
              num_part = filename.replace("slide9-", "").replace(".png", "")
              if num_part.isdigit():
                  valid_follow_indices.append(int(num_part))

          max_followups = max(valid_follow_indices) if valid_follow_indices else 1

          try:
              if os.path.exists(follow_tracker_file):
                  with open(follow_tracker_file, "r", encoding="utf-8") as f:
                      current_follow_val = int(f.read().strip())
              else:
                  current_follow_val = 1
          except Exception:
              current_follow_val = 1

          if current_follow_val >= max_followups:
              next_follow_val = 1
          else:
              next_follow_val = current_follow_val + 1

          with open(follow_tracker_file, "w", encoding="utf-8") as f:
              f.write(str(next_follow_val))

          print(f"Dynamic Follow-up Rotation: Found {max_followups} total follow slides. Rotated tracker: {current_follow_val} -> {next_follow_val}")
          EOF

          # Stage generated artifacts and tracker state files
          git add template.js post.txt Social_Media/ bg_tracker.txt follow_tracker.txt
          
          if ! git diff --cached --quiet; then
            git commit -m "Automated Hourly Update & Dynamic Rotation: $(date +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
            echo "PUSH_SUCCESS=true" >> $GITHUB_ENV
            echo "[SUCCESS] Core payload updated and pushed to remote branch."
          else
            echo "[INFO] No data variance detected in payload files. Skipping commit sequence."
            echo "PUSH_SUCCESS=false" >> $GITHUB_ENV
          fi

      # ==============================================================================
      # [ STEP 4: NODE.JS & CHROMIUM ENVIRONMENT INITIALIZATION ]
      # ==============================================================================
      - name: Setup Node.js Runtime Engine
        if: env.PUSH_SUCCESS == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer Browser Rendering Engine
        if: env.PUSH_SUCCESS == 'true' || github.event_name == 'workflow_dispatch'
        run: npm install puppeteer

      # ==============================================================================
      # [ STEP 5: VISUAL SLIDE RENDER & CAPTURE PIPELINE ]
      # ==============================================================================
      - name: Render and Synchronize Visual Slide Packages
        if: env.PUSH_SUCCESS == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          echo "[INFO] Initiating live web server cache validation for GitHub Pages..."
          python - << 'EOF'
          import requests
          import time

          target_url = "https://siyalair-logistics.github.io/SiyalAir-Intelligence/template.js"
          success = False

          for attempt in range(30):
              try:
                  response = requests.get(f"{target_url}?nocache={int(time.time())}", timeout=10)
                  if response.status_code == 200 and "dailyData" in response.text:
                      print(f"[SUCCESS] Live CDN synchronized successfully on attempt {attempt + 1}.")
                      success = True
                      break
              except Exception as e:
                  print(f"[WARNING] Network polling attempt {attempt + 1} deferred: {str(e)}")
              time.sleep(10)

          if not success:
              print("[WARNING] Network sync verification timed out. Proceeding using workspace local buffer.")
          EOF
          
          # CDN propagation settling buffer gate
          sleep 15
          
          # Execute headless browser screenshot capture pipeline
          node download/capture_slides.js

      # ==============================================================================
      # [ STEP 6: CAPTURED ASSETS COMMIT & STORAGE SYNCHRONIZATION ]
      # ==============================================================================
      - name: Commit Captured Graphic Asset Packages
        if: env.PUSH_SUCCESS == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git fetch origin main
          git reset --mixed origin/main
          
          git add download/
          
          if ! git diff --cached --quiet download/; then
            git commit -m "Automated Graphic Asset Sync: $(date +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
            echo "[SUCCESS] Captured slide image assets committed and synchronized."
          else
            echo "[INFO] No visual image asset updates detected. Skipping asset commit."
          fi

      # ==============================================================================
      # [ STEP 7: DISPATCH EMAIL NOTIFICATION PIPELINE ]
      # ==============================================================================
      - name: Dispatch Reconfirmation Email Notification
        if: env.PUSH_SUCCESS == 'true' || github.event_name == 'workflow_dispatch'
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: |
          sleep 10
          python - << 'EOF'
          import os
          import re
          import smtplib
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText

          try:
              with open('template.js', 'r', encoding='utf-8') as f:
                  content = f.read()

              try:
                  with open('post.txt', 'r', encoding='utf-8') as pf:
                      post_content = pf.read().strip()
              except Exception:
                  post_content = "Error: post.txt content unavailable in workspace."

              tw_match = re.search(r'"titleWhite"\s*:\s*"([^"]+)"', content)
              tb_match = re.search(r'"titleBlue"\s*:\s*"([^"]+)"', content)

              title_white = tw_match.group(1).strip() if tw_match else "SIYAL"
              title_blue = tb_match.group(1).strip() if tb_match else "AIR"
              
              subject_line = f"{title_white} {title_blue}".title()
              
              recipient = "wonderway.fun@gmail.com"
              sender = os.environ.get('EMAIL_USER')
              password = os.environ.get('EMAIL_PASS')

              msg = MIMEMultipart()
              msg['Subject'] = subject_line
              msg['From'] = f"SiyalAir Core <{sender}>"
              msg['To'] = recipient

              html_body = f"""
              <html>
                <body style="background-color: #0d1117; color: #c9d1d9; font-family: monospace; padding: 30px;">
                  <div style="max-width: 600px; margin: 0 auto; border: 1px solid #30363d; padding: 20px; border-radius: 6px; background-color: #161b22;">
                    <h2 style="color: #00a8a8; border-bottom: 1px solid #30363d; padding-bottom: 10px; margin-top: 0;">⚡ SIYALAIR SYSTEM DISPATCH</h2>
                    <p style="font-size: 14px; color: #8b949e;">Automated reconfirmation deployment pipeline executed successfully.</p>
                    <table style="width: 100%; font-size: 13px; border-collapse: collapse; margin: 20px 0;">
                      <tr>
                        <td style="padding: 6px 0; color: #8b949e; width: 140px;"><strong>Status:</strong></td>
                        <td style="padding: 6px 0; color: #56d364;">UPDATED & DEPLOYED</td>
                      </tr>
                      <tr>
                        <td style="padding: 6px 0; color: #8b949e;"><strong>Subject Context:</strong></td>
                        <td style="padding: 6px 0; color: #ffffff;">{subject_line}</td>
                      </tr>
                      <tr>
                        <td style="padding: 8px 0; color: #8b949e;"><strong>Live Feed URL:</strong></td>
                        <td style="padding: 8px 0;"><a href="https://siyalair-logistics.github.io/SiyalAir-Intelligence" style="color: #00a8a8; text-decoration: underline; font-weight: bold;">Launch Live Dashboard →</a></td>
                      </tr>
                    </table>
                    
                    <h3 style="color: #00a8a8; font-size: 14px; margin-top: 25px; margin-bottom: 10px; border-bottom: 1px solid #30363d; padding-bottom: 5px;">📱 SOCIAL MEDIA POST CONTENT (POST.TXT)</h3>
                    <pre style="background-color: #0d1117; border: 1px solid #30363d; padding: 15px; border-radius: 4px; color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word; margin: 10px 0;">{post_content}</pre>
                    
                    <p style="font-size: 11px; color: #8b949e; border-top: 1px solid #30363d; padding-top: 15px; margin-bottom: 0;">
                      This is an automated operational metric confirmation statement. Do not reply.
                    </p>
                  </div>
                </body>
              </html>
              """
              
              msg.attach(MIMEText(html_body, 'html'))

              attachments_list = []

              if os.path.exists('Social_Media'):
                  for root_dir, _, filenames in os.walk('Social_Media'):
                      for fn in filenames:
                          if fn.endswith('.js'):
                              file_path = os.path.join(root_dir, fn)
                              txt_name = fn[:-3] + '.txt'
                              attachments_list.append((file_path, txt_name))

              if os.path.exists('template.js'):
                  attachments_list.append(('template.js', 'template.txt'))

              if os.path.exists('post.txt'):
                  attachments_list.append(('post.txt', 'post.txt'))

              attached_count = 0
              for file_path, attach_name in attachments_list:
                  try:
                      with open(file_path, 'r', encoding='utf-8') as f_in:
                          file_body = f_in.read()
                          part = MIMEText(file_body, 'plain', 'utf-8')
                          part.add_header('Content-Disposition', f'attachment; filename="{attach_name}"')
                          msg.attach(part)
                          attached_count += 1
                          print(f"[SUCCESS] Attached {file_path} as '{attach_name}'.")
                  except Exception as att_err:
                      print(f"[WARNING] Failed to attach {file_path}: {str(att_err)}")

              server = smtplib.SMTP_SSL('smtp.gmail.com', 465)
              server.login(sender, password)
              server.sendmail(sender, [recipient], msg.as_string())
              server.quit()
              print(f"[SUCCESS] Reconfirmation dispatch email sent to {recipient}.")

          except Exception as e:
              print(f"[ERROR] Dispatch email execution fault: {str(e)}")
          EOF
