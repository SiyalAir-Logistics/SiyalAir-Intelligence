name: Manual Audio Generation Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-audio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python & Node Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts
          cd Social_Media
          npm install
          npm install ffprobe-static ffmpeg-static

      - name: Run Script to Generate Combined Audio
        run: |
          cd Social_Media
          node generate_short.js

      - name: Commit and Push Combined MP3 to Repository
        run: |
          git config --global user.name "SiyalAir-Bot"
          git config --global user.email "bot@siyalair.com"
          git add Social_Media/combined_audio_*.mp3
          git commit -m "Auto-generate combined master audio MP3 [skip ci]" || echo "No changes to commit"
          git push
