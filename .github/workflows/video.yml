name: Manual Video Intelligence Pipeline

on:
  workflow_dispatch:

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Edge-TTS and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts

      - name: Install Node Dependencies
        run: |
          npm install ffmpeg-static ffprobe-static

      - name: Force Static FFmpeg Binary Override
        run: |
          # Remove any apt or pre-existing node bin wrappers to prevent path conflicts
          sudo apt-get remove -y ffmpeg libavcodec-extra || true
          rm -rf node_modules/ffmpeg-static/ffmpeg node_modules/ffmpeg-static/bin

          # Download John Van Sickle's fully-featured static build directly into /usr/local/bin
          curl -L -O https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar -xf ffmpeg-release-amd64-static.tar.xz
          sudo mv ffmpeg-*-amd64-static/ffmpeg /usr/local/bin/
          sudo mv ffmpeg-*-amd64-static/ffprobe /usr/local/bin/
          sudo chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe

          # Ensure system fonts are available for drawtext filters
          sudo apt-get update && sudo apt-get install -y fontconfig libfontconfig1 fonts-dejavu-core

          # Verify that drawtext is natively present in the active binary path
          ffmpeg -filters | grep drawtext

      - name: List Directory Contents for Debugging
        working-directory: ./Social_Media
        run: |
          pwd
          ls -la

      - name: Run Video Generation Script
        working-directory: ./Social_Media
        run: |
          node generate_short.js

      - name: List Output Files for Verification
        working-directory: ./Social_Media
        run: |
          ls -la *.mp4

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-news-short
          path: Social_Media/*.mp4
