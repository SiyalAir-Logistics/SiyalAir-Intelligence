name: Manual Video Intelligence Pipeline

on:
  workflow_dispatch:

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Voice Dependencies (Edge-TTS)
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts

      - name: Conditionally Install Node Dependencies
        run: |
          if [ -f "package.json" ]; then
            echo "Found root package.json, installing root dependencies..."
            npm install
          else
            echo "No root package.json found. Skipping root npm install."
          fi

          if [ -f "Social_Media/package.json" ]; then
            echo "Found Social_Media/package.json, installing module dependencies..."
            cd Social_Media
            npm install
          else
            echo "Error: Social_Media/package.json is missing!"
            exit 1
          fi

      - name: Force Global FFmpeg Binary Symlink Override & Font Provisioning
        run: |
          # 1. Clean out existing distribution conflicts
          sudo apt-get remove -y ffmpeg libavcodec-extra || true

          # 2. Pull John Van Sickle's fully-featured static build globally
          curl -L -O https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar -xf ffmpeg-release-amd64-static.tar.xz
          sudo mv ffmpeg-*-amd64-static/ffmpeg /usr/local/bin/
          sudo mv ffmpeg-*-amd64-static/ffprobe /usr/local/bin/
          sudo chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe

          # 3. Provision system font packages & fontconfig registries
          sudo apt-get update && sudo apt-get install -y fontconfig libfontconfig1 fonts-dejavu-core

          # 4. Intercept Node wrapper paths safely (ensure directories exist first)
          mkdir -p node_modules/ffmpeg-static Social_Media/node_modules/ffmpeg-static
          rm -f node_modules/ffmpeg-static/ffmpeg Social_Media/node_modules/ffmpeg-static/ffmpeg
          ln -s /usr/local/bin/ffmpeg node_modules/ffmpeg-static/ffmpeg || true
          ln -s /usr/local/bin/ffmpeg Social_Media/node_modules/ffmpeg-static/ffmpeg || true

          # 5. Full diagnostic validation matrix check
          echo "=== FFMPEG BINARY VERSION & CONFIGURATION ==="
          ffmpeg -version
          echo "=== VERIFYING DRAWTEXT CAPABILITY ==="
          ffmpeg -filters | grep drawtext || true

      - name: List Directory Contents for Debugging
        working-directory: ./Social_Media
        run: |
          pwd
          ls -la

      - name: Run Video Generation Script
        working-directory: ./Social_Media
        env:
          CI: true
        run: |
          node generate_short.js

      - name: List Output Files for Verification
        working-directory: ./Social_Media
        run: |
          ls -la *.mp4

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-news-short
          path: Social_Media/*.mp4
