name: Manual Video Intelligence Pipeline

on:
  workflow_dispatch:

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Initialize Environment & Install System Dependencies
        run: |
          # 1. Update package lists and install a fully-featured FFmpeg directly via apt (or robust static fallback)
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig libfontconfig1 fonts-dejavu-core xz-utils

          # 2. Install Python voice synthesis package
          python -m pip install --upgrade pip
          pip install edge-tts

      - name: Install Dependencies inside Social_Media
        run: |
          echo "=== INSTALLING DEPENDENCIES IN SOCIAL_MEDIA ==="
          if [ -f "Social_Media/package.json" ]; then
            cd Social_Media
            npm install
            cd ..
          else
            echo "CRITICAL ERROR: Social_Media/package.json is missing!"
            exit 1
          fi

      - name: Enforce Universal Binary Symlink Mapping
        run: |
          # Ensure local runner ffmpeg maps correctly
          which ffmpeg
          mkdir -p Social_Media/node_modules/ffmpeg-static
          ln -sf $(which ffmpeg) Social_Media/node_modules/ffmpeg-static/ffmpeg
          chmod +x Social_Media/node_modules/ffmpeg-static/ffmpeg || true

          echo "=== VALIDATING RENDERER CAPABILITIES ==="
          ffmpeg -version
          ffmpeg -filters | grep drawtext || true

      - name: Execute Automated Video Production Script
        env:
          CI: true
        run: |
          echo "=== EXECUTING SCRIPT FROM SOCIAL_MEDIA DIRECTORY ==="
          if [ -f "Social_Media/generate_short.js" ]; then
            cd Social_Media
            node generate_short.js
          else
            echo "CRITICAL ERROR: Social_Media/generate_short.js could not be found."
            exit 1
          fi

      - name: Harvest and Upload Final Video Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-news-short
          path: |
            **/*.mp4
            !**/node_modules/**
