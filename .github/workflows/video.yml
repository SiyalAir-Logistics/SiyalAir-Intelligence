name: Manual Video Intelligence Pipeline

on:
  workflow_dispatch:

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Edge-TTS and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts

      - name: Install Node Dependencies
        run: |
          npm install ffmpeg-static ffprobe-static

      - name: Install FFmpeg via Package Manager with Font Support
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libfontconfig1 libfreetype6

      - name: List Directory Contents for Debugging
        working-directory: ./Social_Media
        run: |
          pwd
          ls -la

      - name: Run Video Generation Script
        working-directory: ./Social_Media
        run: |
          node generate_short.js

      - name: List Output Files for Verification
        working-directory: ./Social_Media
        run: |
          ls -la *.mp4

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-news-short
          path: Social_Media/*.mp4
