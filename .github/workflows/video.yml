name: Manual Video Intelligence Pipeline

on:
  workflow_dispatch:

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Initialize Environment & Install System Dependencies
        run: |
          # 1. Purge restricted runner FFmpeg and install John Van Sickle's fully-featured static binary globally
          sudo apt-get remove -y ffmpeg libavcodec-extra || true
          if [ ! -f /usr/local/bin/ffmpeg ]; then
            curl -L -O https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            tar -xf ffmpeg-release-amd64-static.tar.xz
            sudo mv ffmpeg-*-amd64-static/ffmpeg /usr/local/bin/
            sudo mv ffmpeg-*-amd64-static/ffprobe /usr/local/bin/
            sudo chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe
            rm -rf ffmpeg-release-amd64-static.tar.xz ffmpeg-*-amd64-static
          fi

          # 2. Provision layout rendering typefaces & fontconfig
          sudo apt-get update && sudo apt-get install -y fontconfig libfontconfig1 fonts-dejavu-core

          # 3. Install Python voice synthesis package
          python -m pip install --upgrade pip
          pip install edge-tts

      - name: Install Node Dependencies from Social_Media
        run: |
          echo "=== INSTALLING DEPENDENCIES FROM SOCIAL_MEDIA DIRECTORY ==="
          if [ -f "Social_Media/package.json" ]; then
            cd Social_Media
            npm install
            cd ..
          else
            echo "CRITICAL ERROR: Social_Media/package.json is missing from the repository."
            exit 1
          fi

      - name: Enforce Universal Binary Symlink Mapping
        run: |
          # Force every local instance of ffmpeg-static wrapper to link directly to the global master binary
          for dir in $(find . -name "ffmpeg-static" -type d -not -path "*/.*"); do
            mkdir -p "$dir"
            rm -f "$dir/ffmpeg"
            ln -s /usr/local/bin/ffmpeg "$dir/ffmpeg"
            chmod +x "$dir/ffmpeg" || true
          done

          # Fallback explicit target mappings
          mkdir -p node_modules/ffmpeg-static Social_Media/node_modules/ffmpeg-static
          ln -sf /usr/local/bin/ffmpeg node_modules/ffmpeg-static/ffmpeg
          ln -sf /usr/local/bin/ffmpeg Social_Media/node_modules/ffmpeg-static/ffmpeg

          echo "=== VALIDATING RENDERER CAPABILITIES ==="
          ffmpeg -version
          ffmpeg -filters | grep drawtext || true

      - name: Execute Automated Video Production Script
        env:
          CI: true
        run: |
          # Locate script dynamically regardless of exact workspace nesting
          SCRIPT_PATH=$(find . -name "generate_short.js" -not -path "*/node_modules/*" | head -n 1)

          if [ -n "$SCRIPT_PATH" ]; then
            SCRIPT_DIR=$(dirname "$SCRIPT_PATH")
            SCRIPT_NAME=$(basename "$SCRIPT_PATH")
            echo "Executing $SCRIPT_NAME inside directory: $SCRIPT_DIR"
            cd "$SCRIPT_DIR"
            node "$SCRIPT_NAME"
          else
            echo "CRITICAL ERROR: generate_short.js is missing from the workspace repository."
            exit 1
          fi

      - name: Harvest and Upload Final Video Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-news-short
          path: |
            **/*.mp4
            !**/node_modules/**
