name: Manual Video Intelligence Pipeline

on:
  workflow_dispatch:

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Edge-TTS and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts

      - name: Install Root Node Dependencies
        run: |
          npm install

      - name: Install Social Media Node Dependencies
        working-directory: ./Social_Media
        run: |
          npm install

      - name: Force Global FFmpeg Binary Symlink Override
        run: |
          # 1. Install John Van Sickle's fully-featured static build globally
          sudo apt-get remove -y ffmpeg libavcodec-extra || true
          curl -L -O https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar -xf ffmpeg-release-amd64-static.tar.xz
          sudo mv ffmpeg-*-amd64-static/ffmpeg /usr/local/bin/
          sudo mv ffmpeg-*-amd64-static/ffprobe /usr/local/bin/
          sudo chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe

          # 2. Provision system font packages
          sudo apt-get update && sudo apt-get install -y fontconfig libfontconfig1 fonts-dejavu-core

          # 3. INTERCEPT AND OVERRIDE NODE_MODULES FFMPEG-STATIC BINARIES
          mkdir -p node_modules/ffmpeg-static Social_Media/node_modules/ffmpeg-static
          rm -f node_modules/ffmpeg-static/ffmpeg Social_Media/node_modules/ffmpeg-static/ffmpeg
          ln -s /usr/local/bin/ffmpeg node_modules/ffmpeg-static/ffmpeg || true
          ln -s /usr/local/bin/ffmpeg Social_Media/node_modules/ffmpeg-static/ffmpeg || true

          # 4. Diagnostic check
          ffmpeg -version

      - name: List Directory Contents for Debugging
        working-directory: ./Social_Media
        run: |
          pwd
          ls -la

      - name: Run Video Generation Script
        working-directory: ./Social_Media
        env:
          CI: true
        run: |
          node generate_short.js

      - name: List Output Files for Verification
        working-directory: ./Social_Media
        run: |
          ls -la *.mp4

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-news-short
          path: Social_Media/*.mp4
