name: Manual Video Intelligence Pipeline

on:
  workflow_dispatch:

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Python Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-edge-tts-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python Voice Dependencies (Edge-TTS)
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts

      - name: Locate and Install Node Dependencies
        run: |
          echo "=== SCANNING REPOSITORY FOR PACKAGE.JSON FILES ==="
          find . -name "package.json" -not -path "*/node_modules/*"

          # If package.json is nested inside Social_Media or root, handle it dynamically
          if [ -f "package.json" ]; then
            echo "Installing root node modules..."
            npm install
          fi

          if [ -f "Social_Media/package.json" ]; then
            echo "Installing Social_Media node modules..."
            cd Social_Media
            npm install
            cd ..
          elif [ -f "package.json" ] && [ ! -d "Social_Media" ]; then
            echo "Working directly from root workspace."
          else
            # Fallback search if path is different
            TARGET_DIR=$(find . -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \; | head -n 1)
            if [ -n "$TARGET_DIR" ] && [ "$TARGET_DIR" != "." ]; then
              echo "Found package.json in dynamic path: $TARGET_DIR"
              cd "$TARGET_DIR"
              npm install
              cd -
            else
              echo "CRITICAL ERROR: Could not find any valid package.json file in the repository tree!"
              exit 1
            fi
          fi

      - name: Force Global FFmpeg Binary Symlink Override & Font Provisioning
        run: |
          # 1. Purge conflicting distributions
          sudo apt-get remove -y ffmpeg libavcodec-extra || true

          # 2. Download and configure John Van Sickle's static build globally
          if [ ! -f /usr/local/bin/ffmpeg ]; then
            curl -L -O https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            tar -xf ffmpeg-release-amd64-static.tar.xz
            sudo mv ffmpeg-*-amd64-static/ffmpeg /usr/local/bin/
            sudo mv ffmpeg-*-amd64-static/ffprobe /usr/local/bin/
            sudo chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe
            rm -rf ffmpeg-release-amd64-static.tar.xz ffmpeg-*-amd64-static
          fi

          # 3. Provision system fonts
          sudo apt-get update && sudo apt-get install -y fontconfig libfontconfig1 fonts-dejavu-core

          # 4. Enforce local node module wrapper overrides
          TARGET_DIR=$(find . -name "generate_short.js" -not -path "*/node_modules/*" -exec dirname {} \; | head -n 1)
          if [ -n "$TARGET_DIR" ]; then
            mkdir -p "$TARGET_DIR/node_modules/ffmpeg-static"
            rm -f "$TARGET_DIR/node_modules/ffmpeg-static/ffmpeg"
            ln -s /usr/local/bin/ffmpeg "$TARGET_DIR/node_modules/ffmpeg-static/ffmpeg" || true
          fi
          
          mkdir -p node_modules/ffmpeg-static
          rm -f node_modules/ffmpeg-static/ffmpeg
          ln -s /usr/local/bin/ffmpeg node_modules/ffmpeg-static/ffmpeg || true

          # 5. Validation
          ffmpeg -version

      - name: Execute Video Generation Pipeline
        env:
          CI: true
        run: |
          TARGET_DIR=$(find . -name "generate_short.js" -not -path "*/node_modules/*" -exec dirname {} \; | head -n 1)
          if [ -n "$TARGET_DIR" ]; then
            echo "Executing script from directory: $TARGET_DIR"
            cd "$TARGET_DIR"
            node generate_short.js
          else
            echo "Error: generate_short.js not found anywhere in repository tree."
            exit 1
          fi

      - name: Locate and Upload Generated Video Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-news-short
          path: |
            **/*.mp4
            !**/node_modules/**
